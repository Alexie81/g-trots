<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#080706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="G-Trots" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="G-Trots" />
    <meta name="description" content="Aplicația G-Trots pentru service, clienți, stocuri și magazin." />
    <link rel="manifest" href="/aplicatie/manifest.json" />
    <link rel="apple-touch-icon" href="/aplicatie/icon-180.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        var pwaReloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (pwaReloading) return;
          pwaReloading = true;
          window.location.reload();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/aplicatie/pwa-sw.js', { scope: '/aplicatie/' })
            .then(function (registration) { return registration.update(); })
            .catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      Aplicația G-Trots necesită JavaScript activat.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
